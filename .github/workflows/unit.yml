name: Test

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    name: Lint & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Enable corepack
        run: corepack enable

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run coverage
